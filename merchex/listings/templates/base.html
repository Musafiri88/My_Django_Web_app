{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Merchex{% endblock title %}</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Merchex</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'listings' %}">Listings</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="menu">
            <div class="menu_icon">&#9776;</div>

            <ul class="menu_list">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'listings' %}">Listings</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Merchex. All rights reserved.</p>
    </footer>
</body>
</html>
